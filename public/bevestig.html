<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Doe je mee? · Padelplanner Assen</title>
<style>
  :root { --bg:#f3f5f1; --card:#fff; --tekst:#14202e; --zacht:#5b6677; --lijn:#e1e5e0; --accent:#1f56d6; --bal:#c8f04a; --baan:#0e2a5c; --goed:#11805a; --let:#9a6200; --fout:#c62a33; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0c1118; --card:#141b26; --tekst:#e9edf3; --zacht:#98a3b6; --lijn:#253044; --accent:#6c9cff; --goed:#3fd09d; --let:#e7b64a; --fout:#ff6b73; } }
  body { margin:0; font:16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--tekst); }
  header { background:var(--baan); color:#fff; padding:22px 20px; font-weight:700; font-size:1.15rem; }
  header span { color:var(--bal); }
  main { max-width:560px; margin:-10px auto 40px; padding:0 16px; }
  .kaart { background:var(--card); border:1px solid var(--lijn); border-radius:16px; padding:22px; margin-top:20px; }
  h1 { font-size:1.3rem; margin:0 0 6px; }
  .zacht { color:var(--zacht); }
  .knoppen { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
  button, a.knop { font:inherit; font-weight:600; border-radius:999px; padding:11px 20px; border:1px solid transparent; cursor:pointer; text-decoration:none; }
  .ja { background:var(--bal); color:#0b2545; }
  .nee { background:transparent; color:var(--tekst); border-color:var(--lijn); }
  .gekozen { outline:3px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset:2px; }
  button:disabled { opacity:.6; cursor:default; }
  .melding { margin-top:16px; font-weight:600; }
  .ok { color:var(--goed); } .fout { color:var(--fout); } .let { color:var(--let); }
  ul { padding-left:20px; margin:8px 0 0; }
</style>
</head>
<body>
<header>Padel<span>planner</span> Assen</header>
<main>
  <div class="kaart" id="kaart"><p class="zacht">Uitnodiging laden…</p></div>
  <p class="zacht" style="margin:16px 4px"><a href="/?tab=planning">Naar de Padelplanner</a></p>
</main>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const t = q.get('t') || '', keuze = q.get('a');
  const kaart = document.getElementById('kaart');
  const el = (tag, cls, tekst) => { const e = document.createElement(tag); if (cls) e.className = cls; if (tekst != null) e.textContent = tekst; return e; };
  const fout = (tekst) => kaart.replaceChildren(el('h1', null, 'Dat lukt niet'), el('p', 'fout', tekst));
  const dag = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' }); };
  const eind = (tijd, duur) => { const [u, m] = tijd.split(':').map(Number); const x = u * 60 + m + Number(duur); return String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0'); };
  let clubs = [];
  try { clubs = (await (await fetch('clubs.json')).json()).clubs || []; } catch (e) {}
  let info;
  try {
    const r = await fetch('/api/antwoord?t=' + encodeURIComponent(t));
    info = await r.json();
    if (!r.ok) return fout(info.fout || 'Deze link klopt niet (meer).');
  } catch (e) { return fout('De uitnodiging kon niet worden geladen. Probeer het later opnieuw.'); }
  const p = info.partij;
  const club = clubs.find((c) => c.id === p.clubId);
  const statusTekst = {
    uitgenodigd: 'Je hebt nog niet gereageerd.',
    bevestigd: info.reserve ? 'Je staat op de reservelijst.' : 'Je hebt bevestigd dat je meedoet.',
    afgezegd: 'Je hebt afgezegd.',
    verlopen: 'Je hebt niet op tijd gereageerd, dus je plek is aan iemand anders gegeven. Je kunt je nog wel opgeven; is de partij vol, dan kom je op de reservelijst.'
  }[info.status] || '';
  const lijst = el('ul');
  info.spelers.forEach((s) => lijst.append(el('li', null, s.naam + (s.status === 'uitgenodigd' ? ' (nog geen antwoord)' : ' ✓'))));
  const melding = el('div', 'melding');
  const ja = el('button', 'ja', 'Ik doe mee'), nee = el('button', 'nee', 'Kan toch niet');
  if (keuze === 'ja') ja.classList.add('gekozen');
  if (keuze === 'nee') nee.classList.add('gekozen');
  kaart.replaceChildren(
    el('h1', null, 'Hoi ' + info.naam + ', doe je mee?'),
    el('p', null, dag(p.datum) + ' van ' + p.tijd + ' tot ' + eind(p.tijd, p.duur) + (club ? ' bij ' + club.naam : '')),
    el('p', 'zacht', 'Spelers:'), lijst,
    el('p', info.status === 'verlopen' ? 'let' : 'zacht', statusTekst),
    info.voorbij ? el('p', 'fout', 'Deze partij is al voorbij.') : el('div', 'knoppen'),
    melding);
  if (info.voorbij) return;
  if (keuze) melding.replaceChildren(el('span', 'zacht', 'Klik op de knop om je antwoord te bevestigen.'));
  kaart.querySelector('.knoppen').append(ja, nee);
  async function stuur(a) {
    ja.disabled = nee.disabled = true;
    try {
      const r = await fetch('/api/antwoord', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ t, a }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.fout || 'Dat lukte niet.');
      melding.className = 'melding ok'; melding.textContent = d.tekst;
      ja.classList.toggle('gekozen', a === 'ja'); nee.classList.toggle('gekozen', a === 'nee');
    } catch (e) { melding.className = 'melding fout'; melding.textContent = e.message; }
    ja.disabled = nee.disabled = false;
  }
  ja.addEventListener('click', () => stuur('ja'));
  nee.addEventListener('click', () => stuur('nee'));
})();
</script>
</body>
</html>
